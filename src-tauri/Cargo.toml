[package]
name = "aibo"
version = "0.1.1"
description = "Aibo local multi-agent workbench"
license = "MIT"
authors = ["Aibo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aibo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
serde_json = "1.0"
sha2 = "0.10"

[dependencies]
jsonschema = { version = "0.33", default-features = false }
base64 = "0.22"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-opener = "~2.7.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.53", features = ["io-util", "macros", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.1"
ignore = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
flate2 = "1.1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
