[package]
name = "aibo"
version = "0.1.0"
description = "Aibo local multi-agent workbench"
authors = ["Aibo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aibo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.0.0-rc.8"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.53", features = ["io-util", "macros", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.1"
