<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aibo · 应用图标候选</title>
<style>
/* App icon study. Theme: 相棒 (あいぼう) — a partner who shares the load.
   Every candidate is drawn on the macOS icon grid: 1024 canvas, 824 body,
   so previews at any size already include the system margin. Colorways are
   deliberately skin-neutral (ink / paper / vermilion), no blue-purple. */
:root {
  --page:#f3f1ec; --card:#fff; --text:#1c1c1f; --muted:#6b6862; --line:#e0dcd3;
  --strip-light:#ecebe8; --strip-dark:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--text); }
main { max-width:1180px; margin:0 auto; padding:48px 32px 96px; }
h1 { font-size:28px; font-weight:600; margin:0 0 10px; letter-spacing:.01em; }
h2 { font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--muted); margin:48px 0 16px; text-transform:uppercase; }
.lede { margin:0; max-width:760px; color:var(--muted); font-size:14px; line-height:1.75; }

.toolbar { display:flex; gap:16px; align-items:center; margin:28px 0 0; flex-wrap:wrap; font-size:13px; color:var(--muted); }
.seg { display:inline-flex; gap:2px; padding:3px; background:#fff; border:1px solid var(--line); border-radius:9px; }
.seg button { all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:6px; color:var(--muted); }
.seg button:focus-visible { outline:2px solid var(--text); outline-offset:1px; }
.seg button[aria-pressed="true"] { background:var(--text); color:#fff; }
.chip { display:inline-flex; width:30px; height:12px; border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.12); }
.chip i { flex:1; }

/* Desktop + dock simulation */
.desks { display:grid; grid-template-columns:1fr; gap:16px; }
.desk { position:relative; height:220px; border-radius:14px; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; padding-bottom:18px; }
.desk.light { background:radial-gradient(120% 90% at 20% 10%,#f6efe3 0%,#d9d2c6 45%,#b9b3aa 100%); }
.desk.dark { background:radial-gradient(120% 90% at 80% 0%,#3b3a3f 0%,#222226 50%,#141416 100%); }
.desk .tag { position:absolute; top:14px; left:16px; font-size:12px; color:rgba(0,0,0,.5); }
.desk.dark .tag { color:rgba(255,255,255,.5); }
.dock { display:flex; gap:6px; padding:6px 10px; border-radius:22px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  background:rgba(255,255,255,.35); box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.15); }
.desk.dark .dock { background:rgba(60,60,66,.45); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.4); }
.dock figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
.dock figcaption { font-size:10px; color:rgba(0,0,0,.55); }
.desk.dark .dock figcaption { color:rgba(255,255,255,.55); }

/* Candidate cards */
.cards { display:grid; gap:16px; }
.card { display:grid; grid-template-columns:280px 1fr; gap:32px; padding:28px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
.hero { display:grid; place-items:center; background:var(--strip-light); border-radius:12px; min-height:260px; }
.hero svg { filter:drop-shadow(0 10px 14px rgba(0,0,0,.18)); }
.meta h3 { margin:0; font-size:22px; font-weight:600; display:flex; align-items:baseline; gap:10px; }
.meta h3 small { font-size:13px; font-weight:400; color:var(--muted); letter-spacing:.04em; }
.meta .num { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.meta p { margin:10px 0 18px; font-size:14px; line-height:1.75; color:#3d3b37; max-width:560px; }
.strip { display:flex; align-items:flex-end; gap:28px; padding:16px 20px 12px; border-radius:10px; background:var(--strip-light); }
.strip + .strip { margin-top:8px; }
.strip.dark { background:var(--strip-dark); }
.strip figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
.strip figcaption { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.strip.dark figcaption { color:#8d8b87; }
.note { margin-top:40px; font-size:12px; line-height:1.7; color:var(--muted); }

@media (max-width:820px) {
  .desks { grid-template-columns:1fr; }
  .card { grid-template-columns:1fr; }
  .strip { gap:16px; overflow-x:auto; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Aibo 应用图标候选</h1>
    <p class="lede">
      主题是「相棒」（あいぼう）。这个词原本指抬轿时和你扛同一根杠子的人，后来引申为搭档。
      每个方案都由两部分组成：一个代表你，一个代表 Agent，合在一起才完整。
      配色只用墨、纸、朱三种中性色，不跟任何一套皮肤绑定。
    </p>
    <div class="toolbar">
      <span>配色</span>
      <div class="seg" id="colorways" role="group" aria-label="配色"></div>
    </div>
  </header>

  <h2>放在 Dock 里</h2>
  <div class="desks">
    <div class="desk light"><span class="tag">浅色桌面</span><div class="dock" data-dock></div></div>
    <div class="desk dark"><span class="tag">深色桌面</span><div class="dock" data-dock></div></div>
  </div>

  <h2>逐个查看</h2>
  <div class="cards" id="cards"></div>

  <p class="note">
    所有方案都画在 macOS 图标网格上（1024 画布，824 主体），所以预览尺寸里已经包含系统留白。
    尺寸按 CSS 像素显示，Retina 屏上 16px 实际是 32 物理像素，比 1x 屏幕上看到的更清楚。
    主体轮廓暂用圆角矩形近似 macOS 的超椭圆，定稿时再换成精确路径。
  </p>
</main>

<script>
const colorways = {
  ink:   { label: '墨', bg: '#18181b', a: '#eee8dc', b: '#e4472b', edge: null },
  paper: { label: '纸', bg: '#f1ece2', a: '#1d1d20', b: '#e4472b', edge: 'rgba(0,0,0,.10)' },
  shu:   { label: '朱', bg: '#df4329', a: '#fbf6ec', b: '#1d1b1a', edge: null },
  mono:  { label: '灰度', bg: '#202022', a: '#f2f2f2', b: '#8c8c8c', edge: null },
};

// Glyphs live in the 1024 grid; visual center is (512, 512).
const candidates = [
  {
    no: '01', name: '两笔 · 原版', en: 'Two Strokes',
    idea: '一个圆环加一根竖笔。问题是两笔之间有空隙，竖笔两端又都是圆头，读起来更像「oi」而不是「a」。留在这里作对照。',
    glyph: (c) => `
      <circle cx="456" cy="512" r="148" fill="none" stroke="${c.a}" stroke-width="88"/>
      <rect x="672" y="320" width="88" height="384" rx="44" fill="${c.b}"/>`,
  },
  {
    no: '01a', name: '两笔 · 贴合', en: 'Overlap',
    idea: '竖笔压在圆环右侧的笔画上，两端切平，和圆环上下齐平。这是 Futura 那种几何 a 的标准结构，一眼就是 a；朱色竖笔盖住圆环的一段，「两人合力」的意思反而更明确。',
    glyph: (c) => `
      <circle cx="512" cy="512" r="148" fill="none" stroke="${c.a}" stroke-width="88"/>
      <rect x="616" y="320" width="88" height="384" fill="${c.b}"/>`,
  },
  {
    no: '01b', name: '两笔 · 相切', en: 'Tangent',
    idea: '保留两笔分开的感觉，但竖笔紧贴圆环外侧，没有空隙；顶端圆头、底端切平，像字母落在基线上。比原版好一些，但实际看下来竖笔仍然独立，还是容易读成「oI」。',
    glyph: (c) => `
      <circle cx="468" cy="512" r="148" fill="none" stroke="${c.a}" stroke-width="88"/>
      <path d="M660 704V364A44 44 0 0 1 748 364V704Z" fill="${c.b}"/>`,
  },
  {
    no: '01c', name: '两笔 · 缺口', en: 'Notch',
    idea: '圆环在右侧让出一个缺口，竖笔正好嵌在缺口里。圆环不再是封闭的 o，而是一个等着另一半的形状：概念最好，但实际看下来缺口让圆环变成了 C，整体容易读成「CI」。',
    glyph: (c) => `
      <path d="M595.4 607.1A148 148 0 1 1 595.4 416.9" fill="none" stroke="${c.a}" stroke-width="88"/>
      <rect x="646" y="320" width="88" height="384" fill="${c.b}"/>`,
  },
  {
    no: '02', name: '合璧', en: 'Two Halves',
    idea: '一个圆被分成两半，错开半步。单看哪一半都不完整，合起来才是一个整体；错位又带出一点向前的动势。最抽象，也最像一枚标志。',
    glyph: (c) => `
      <path d="M500 242A210 210 0 0 0 500 662Z" fill="${c.a}"/>
      <path d="M524 362A210 210 0 0 1 524 782Z" fill="${c.b}"/>`,
  },
  {
    no: '03', name: '圆与方', en: 'Circle & Square',
    idea: '圆代表人，方代表机器。两者重叠的地方被挖空，那块交集就是 Aibo 工作的地方。包豪斯式的构成，几何感最强。',
    glyph: (c, id) => `
      <defs><clipPath id="${id}"><rect x="440" y="260" width="320" height="320" rx="24"/></clipPath></defs>
      <rect x="440" y="260" width="320" height="320" rx="24" fill="${c.b}"/>
      <circle cx="430" cy="590" r="175" fill="${c.a}"/>
      <circle cx="430" cy="590" r="175" fill="${c.bg}" clip-path="url(#${id})"/>`,
  },
  {
    no: '04', name: '并肩', en: 'Side by Side',
    idea: '两个胶囊形，一高一矮，矮的那个微微靠向同伴。最接近「两个人」的形象，气质最温和，有一点陪伴感。',
    glyph: (c) => `
      <rect x="310" y="290" width="160" height="444" rx="80" fill="${c.a}"/>
      <rect x="560" y="374" width="160" height="360" rx="80" fill="${c.b}" transform="rotate(-12 640 734)"/>`,
  },
  {
    no: '05', name: '一根棒', en: 'One Pole',
    idea: '直接讲名字的来历：一根横杠架在两个肩头上，两个人一起扛。故事最完整，但图形偏扁，小尺寸时的辨识度要重点看。',
    glyph: (c) => `
      <rect x="182" y="397" width="660" height="64" rx="32" fill="${c.a}"/>
      <path d="M202 627A150 150 0 0 1 502 627Z" fill="${c.a}"/>
      <path d="M522 627A150 150 0 0 1 822 627Z" fill="${c.b}"/>`,
  },
];

let uid = 0;
function icon(cand, size, cw) {
  const c = colorways[cw];
  const edge = c.edge ? `stroke="${c.edge}" stroke-width="4"` : '';
  return `<svg viewBox="0 0 1024 1024" width="${size}" height="${size}" role="img" aria-label="${cand.name}">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="${c.bg}" ${edge}/>
    ${cand.glyph(c, `aibo-clip-${uid++}`)}
  </svg>`;
}

const sizes = [128, 64, 32, 16];
const strip = (cand, cw, tone) => `
  <div class="strip ${tone}">
    ${sizes.map((s) => `<figure>${icon(cand, s, cw)}<figcaption>${s}</figcaption></figure>`).join('')}
  </div>`;

function render(cw) {
  for (const dock of document.querySelectorAll('[data-dock]')) {
    dock.innerHTML = candidates
      .map((cand) => `<figure>${icon(cand, 64, cw)}<figcaption>${cand.name}</figcaption></figure>`)
      .join('');
  }
  document.getElementById('cards').innerHTML = candidates.map((cand) => `
    <article class="card">
      <div class="hero">${icon(cand, 240, cw)}</div>
      <div class="meta">
        <span class="num">${cand.no}</span>
        <h3>${cand.name}<small>${cand.en}</small></h3>
        <p>${cand.idea}</p>
        ${strip(cand, cw, 'light')}
        ${strip(cand, cw, 'dark')}
      </div>
    </article>`).join('');
  for (const button of document.querySelectorAll('#colorways button')) {
    button.setAttribute('aria-pressed', String(button.dataset.cw === cw));
  }
}

document.getElementById('colorways').innerHTML = Object.entries(colorways).map(([key, c]) => `
  <button type="button" data-cw="${key}" aria-pressed="false">
    <span class="chip"><i style="background:${c.bg}"></i><i style="background:${c.a}"></i><i style="background:${c.b}"></i></span>${c.label}
  </button>`).join('');
document.getElementById('colorways').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-cw]');
  if (button) render(button.dataset.cw);
});

render('ink');
</script>
</body>
</html>
